name: Build & Release RainyMCS Plugins

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WASM Plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build All Plugins
        run: |
          cargo build --release --target wasm32-wasip2

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          find target/wasm32-wasip2/release/ -maxdepth 1 -name "*.wasm" -exec cp {} dist/ \;
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RainyMCS Official Plugins v1.0.0"
          draft: false
          prerelease: false
          files: dist/*.wasm
          body: |
            ## RainyMCS Official WASM Plugins
            Compiled WebAssembly component plugins for the RainyMCS Minecraft server.

            - `rainy_essentials.wasm` (/spawn, /home, /sethome)
            - `rainy_rtp.wasm` (/rtp, /wild)
            - `rainy_economy.wasm` (/bal, /balance)
            - `rainy_protection.wasm` (/claim)
            - `rainy_chat.wasm` (/broadcast, /bc)
