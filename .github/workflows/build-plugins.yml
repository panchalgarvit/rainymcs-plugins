name: Build & Release RainyMCS Plugins

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WASM Plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust with WASM targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build All Plugins
        run: |
          cargo build --release --target wasm32-wasip2

      - name: Stage Release Binaries
        run: |
          mkdir -p dist
          cp target/wasm32-wasip2/release/rainy_essentials.wasm dist/ || true
          cp target/wasm32-wasip2/release/rainy_rtp.wasm dist/ || true
          cp target/wasm32-wasip2/release/rainy_economy.wasm dist/ || true
          cp target/wasm32-wasip2/release/rainy_protection.wasm dist/ || true
          cp target/wasm32-wasip2/release/rainy_chat.wasm dist/ || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "RainyMCS Official Plugins v1.0.0"
          draft: false
          prerelease: false
          files: dist/*.wasm
          body: |
            ## RainyMCS Official WASM Plugins
            Official WebAssembly plugins compiled for the Pumpkin (Rust) server engine.

            - `rainy_essentials.wasm` - /spawn, /home, /sethome, welcome messages
            - `rainy_rtp.wasm` - /rtp wilderness random teleportation
            - `rainy_economy.wasm` - /bal, /balance, wallet system
            - `rainy_protection.wasm` - /claim, spawn protection
            - `rainy_chat.wasm` - /broadcast, chat tags and formatting
